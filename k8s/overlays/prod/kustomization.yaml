apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: examination-system

namePrefix: prod-

bases:
  - ../../base

patchesStrategicMerge:
  - deployment-patches.yaml

configMapGenerator:
  - name: backend-config
    namespace: examination-system
    behavior: merge
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - CORS_ORIGIN=https://examination.yourdomain.com

  - name: frontend-config
    namespace: examination-system
    behavior: merge
    literals:
      - REACT_APP_API_URL=https://api.examination.yourdomain.com
      - REACT_APP_SOCKET_URL=wss://api.examination.yourdomain.com
      - REACT_APP_ENVIRONMENT=production

replicas:
  - name: backend
    count: 3
  - name: frontend
    count: 3

commonLabels:
  environment: production
