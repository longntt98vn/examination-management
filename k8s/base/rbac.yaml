apiVersion: v1
kind: ServiceAccount
metadata:
  name: examination-sa
  namespace: examination-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: examination-role
  namespace: examination-system
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: examination-rolebinding
  namespace: examination-system
subjects:
- kind: ServiceAccount
  name: examination-sa
  namespace: examination-system
roleRef:
  kind: Role
  name: examination-role
  apiGroup: rbac.authorization.k8s.io
