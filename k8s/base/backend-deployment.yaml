apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: examination-system
  labels:
    app: backend
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
        component: api
    spec:
      containers:
      - name: backend
        image: examination-backend:latest  # Replace with your Docker registry
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: backend-config
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: JWT_SECRET
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: SECRET_KEY
        - name: MONGODB_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: username
        - name: MONGODB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
        - name: ORG1_APIKEY
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: ORG1_APIKEY
        - name: ORG2_APIKEY
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: ORG2_APIKEY
        - name: HLF_CONNECTION_PROFILE_ORG1
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: HLF_CONNECTION_PROFILE_ORG1
        - name: HLF_CERTIFICATE_ORG1
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: HLF_CERTIFICATE_ORG1
        - name: HLF_PRIVATE_KEY_ORG1
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: HLF_PRIVATE_KEY_ORG1
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: examination-system
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: backend
